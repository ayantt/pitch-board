services:
  api:
    type: web service
    name: pitch-board-api
    env: docker
    plan: starter
    dockerfilePath: backend/Dockerfile
    startCommand: "./server"
    envVars:
      - key: PORT
        value: "8080"
      - key: SOFASCORE_BASE_URL
        value: "https://www.sofascore.com/api/v1"
    healthCheckPath: /health
